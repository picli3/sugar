name: sugar
services:
  db:
    image: ${DATABASE_IMAGE:-ghcr.io/picli3/sugar-database:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA}}
    networks: [database]
    environment:
      POSTGRES_DB: hardware_designer
      POSTGRES_USER: designer
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, pg_isready -U designer -d hardware_designer]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: unless-stopped
  migrate:
    profiles: [maintenance]
    image: ${API_IMAGE:-ghcr.io/picli3/sugar-api:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA}}
    networks: [database]
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    command: [node, src/migrate.js]
    environment:
      DATABASE_URL: postgres://designer:${DB_PASSWORD}@db:5432/hardware_designer
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD to 64 hex characters}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  api:
    user: '1000:1000'
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    networks: [application, database, egress]
    image: ${API_IMAGE:-ghcr.io/picli3/sugar-api:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA}}
    environment:
      DATABASE_URL: postgres://sugar_runtime:${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD to 64 hex characters}@db:5432/hardware_designer
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:?Keep this key with backups}
      JWT_SECRET: ${JWT_SECRET:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      MFA_ENROLLMENT_ENABLED: ${MFA_ENROLLMENT_ENABLED:-false}
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:-}
      ACCOUNT_RECOVERY_ENABLED: ${ACCOUNT_RECOVERY_ENABLED:-false}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_USER_ENCRYPTION_KEY: ${GITHUB_USER_ENCRYPTION_KEY:-}
      GITHUB_CONNECT_ENABLED: ${GITHUB_CONNECT_ENABLED:-false}
      SESSION_SECURE: 'true'
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      API_IP_LIMIT: ${API_IP_LIMIT:-600}
      API_GLOBAL_LIMIT: ${API_GLOBAL_LIMIT:-3000}
      AUTH_IP_LIMIT: ${AUTH_IP_LIMIT:-20}
      AUTH_GLOBAL_LIMIT: ${AUTH_GLOBAL_LIMIT:-120}
      AUTH_ACCOUNT_LIMIT: ${AUTH_ACCOUNT_LIMIT:-10}
      AUTH_CREDENTIAL_LIMIT: ${AUTH_CREDENTIAL_LIMIT:-5}
      AUTH_HASH_CONCURRENCY: ${AUTH_HASH_CONCURRENCY:-4}
      AUTH_MAX_KEYS: ${AUTH_MAX_KEYS:-20000}
      PORT: 3000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://sugar.maykolrey.com}
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: unless-stopped
  web:
    networks: [front, application]
    image: ${WEB_IMAGE:-ghcr.io/picli3/sugar-web:${IMAGE_TAG:?Set IMAGE_TAG}}
    ports:
      - 127.0.0.1:18088:80
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/api/ready]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: unless-stopped
volumes:
  postgres_data:

# No shared external networks or fixed subnets: avoid other applications and collisions.
networks:
  front: {}
  application:
    internal: true
  database:
    internal: true
  egress: {}
