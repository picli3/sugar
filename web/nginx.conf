# Query strings, Referer and private share tokens must not enter access logs.
map $uri $sugar_safe_uri {
    ~^/api/shared/ /api/shared/[redacted];
    default $uri;
}
log_format sugar_safe '$remote_addr - [$time_local] "$request_method $sugar_safe_uri $server_protocol" $status $body_bytes_sent';
map $uri $sugar_csp {
    default "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";
    ~^/api/ "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
}
map $status $sugar_asset_cache {
    default 'private, no-store';
    200 'public, max-age=31536000, immutable';
    304 'public, max-age=31536000, immutable';
}
server {
    access_log /var/log/nginx/access.log sugar_safe;
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control 'private, no-store' always;
  # Re-resolve the API through Docker's embedded DNS so restarting it (new IP) does not leave
  # nginx pointing at a stale address until this container restarts (#31).
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  location /api/ {
    set $sugar_api http://api:3000;
    proxy_pass $sugar_api;
    proxy_read_timeout 125s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cache-Control;
  }
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control $sugar_asset_cache always;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
