name: Test, publish and deploy Sugar
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sugar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed history with pinned offline detector
        run: |
          set -euo pipefail
          docker pull ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          python3 -m unittest discover -s deploy/ci -p 'test_*.py'
          python3 deploy/ci/scan-secrets.py
          python3 -m unittest discover -s deploy/monitoring -p 'test_*.py'
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: designer
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: sugar_ai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U designer -d sugar_ai"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: api
      - name: Verify release workflow policy
        run: node --test deploy/ci/policy.test.mjs
      - run: npm test
        working-directory: api
      - name: PostgreSQL and mocked DeepSeek integration
        working-directory: api
        env:
          DATABASE_URL: postgres://designer:ci-password@127.0.0.1:5432/sugar_ai
          AUTH_IP_LIMIT: '1000'
          AUTH_GLOBAL_LIMIT: '10000'
          AUTH_CREDENTIAL_LIMIT: '1000'
          AUTH_HASH_CONCURRENCY: '32'
          RUNTIME_DB_PASSWORD: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          AI_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          set -euo pipefail
          node --input-type=module -e "import pg from 'pg'; const c=new pg.Client({connectionString:process.env.DATABASE_URL}); await c.connect(); await c.query('CREATE DATABASE sugar_icons'); await c.end()"
          ADMIN_PASSWORD=local-ai-verification-password node src/migrate.js
          DATABASE_URL=postgres://designer:ci-password@127.0.0.1:5432/sugar_icons ADMIN_PASSWORD=local-icons-verification-password node src/migrate.js
          DATABASE_URL=postgres://sugar_runtime:${RUNTIME_DB_PASSWORD}@127.0.0.1:5432/sugar_ai PORT=3001 node --import ./test-support/deepseek-mock.mjs src/server.js > /tmp/sugar-ai.log 2>&1 &
          ai_pid=$!
          DATABASE_URL=postgres://sugar_runtime:${RUNTIME_DB_PASSWORD}@127.0.0.1:5432/sugar_icons PORT=3002 node src/server.js > /tmp/sugar-icons.log 2>&1 &
          icons_pid=$!
          trap 'kill "$ai_pid" "$icons_pid" 2>/dev/null || true' EXIT
          for port in 3001 3002; do
            curl --fail --silent --retry 30 --retry-connrefused --retry-delay 1 "http://127.0.0.1:$port/api/ready" > /dev/null
          done
          AI_TEST_URL=http://127.0.0.1:3001 ICON_TEST_URL=http://127.0.0.1:3002 API_TEST_URL=http://127.0.0.1:3002 API_TEST_DATABASE_URL=postgres://designer:ci-password@127.0.0.1:5432/sugar_icons npm test
      - name: Isolated administrative access and recovery checks
        run: |
          set -euo pipefail
          bash -n deploy/deploy.sh deploy/ssh-gateway.sh
          python3 -m unittest discover -s deploy/security -p 'test_*.py'
          docker build -f deploy/database/Dockerfile.test-runner -t sugar-release-runner-test .
          docker run --rm --network none sugar-release-runner-test
          docker build -f deploy/security/Dockerfile.test -t sugar-admin-security-test .
          docker run --rm --network none sugar-admin-security-test
      - name: Isolated service network policy
        run: |
          set -euo pipefail
          python3 -m unittest discover -s deploy/network -p 'test_*.py'
          docker build -f deploy/network/Dockerfile.test -t sugar-network-probe .
          python3 deploy/network/smoke.py
      - name: Isolated encrypted backup and restore
        run: |
          set -euo pipefail
          docker build -f deploy/backup/Dockerfile.test -t sugar-backup-test .
          python3 deploy/backup/smoke.py
      - name: Isolated unprivileged API container
        run: |
          set -euo pipefail
          python3 -m unittest discover -s deploy/containers -p 'test_*.py'
          docker build -t sugar-privilege-api api
          docker build -f deploy/containers/Dockerfile.test -t sugar-privilege-api-check .
          docker build -t sugar-privilege-web web
          docker build -t sugar-privilege-database deploy/database
          GOSU_TEST_IMAGE=sugar-privilege-database python3 -m unittest discover -s deploy/database -p 'test_gosu.py'
          python3 deploy/containers/smoke.py --rollback-database-image postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
          python3 -m unittest discover -s deploy/headers -p 'test_*.py'
      - run: npm ci
        working-directory: web
      - run: npm test && npm run build
        working-directory: web
      - name: Audit dependencies and final runtime images
        run: |
          set -euo pipefail
          python3 -m unittest discover -s deploy/ci -p 'test_vulnerabilities.py'
          ARTIFACT_DOCKER_TEST=1 python3 -m unittest discover -s deploy/ci -p 'test_artifacts.py'
          python3 deploy/ci/scan-vulnerabilities.py --npm --images sugar-privilege-api sugar-privilege-web sugar-privilege-database --manifest "$RUNNER_TEMP/scanned-images.json" --commit "$GITHUB_SHA"
      - name: Export verified release images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python3 deploy/ci/runtime-artifact.py export --directory "$RUNNER_TEMP/sugar-runtime" --source "$RUNNER_TEMP/scanned-images.json" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: runtime-${{ github.sha }}
          path: ${{ runner.temp }}/sugar-runtime/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, secrets]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [api, web, database]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ github.sha }}
          path: ${{ runner.temp }}/sugar-runtime/
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the scanned image without rebuilding
        env:
          COMPONENT: ${{ matrix.component }}
        run: python3 deploy/ci/runtime-artifact.py promote --directory "$RUNNER_TEMP/sugar-runtime" --commit "$GITHUB_SHA" --component "$COMPONENT" --push
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ github.sha }}
          path: ${{ runner.temp }}/sugar-runtime/
      - name: Deploy the tested commit through a restricted SSH key
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.VPS_HOST }}
          DEPLOY_USER: ${{ vars.VPS_USER }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/sugar_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/sugar_deploy' EXIT
          descriptor=$(python3 deploy/ci/runtime-artifact.py describe --directory "$RUNNER_TEMP/sugar-runtime" --commit "$GITHUB_SHA")
          printf '%s\n%s\n' "$REGISTRY_TOKEN" "$descriptor" | ssh -T -i ~/.ssh/sugar_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" "deploy-v2 $DEPLOY_SHA"
      - name: Verify public HTTPS endpoint
        run: curl --fail --show-error --silent --retry 6 --retry-delay 5 https://sugar.maykolrey.com/api/ready
